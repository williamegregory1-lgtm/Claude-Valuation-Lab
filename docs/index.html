<header class="hero"><div class="hero-inner"><div><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><p>Equity valuation, analyst-informed scenarios, state-contingent payoffs, and risk-neutral pricing</p></div><div class="firm" id="firmMeta"></div></div></header>
<main id="app"><div class="card panel">Loading validated notebook results…</div></main>
<script>
const C={navy:'#0b2747',blue:'#197ba6',teal:'#0fa99d',gold:'#e2a72d',orange:'#f2762e',red:'#d94d4d',purple:'#7655b5',slate:'#68798e'};const stateColors=[C.red,C.orange,C.gold,C.teal,C.blue];
const config={responsive:true,displayModeBar:false,scrollZoom:false};const money=v=>'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const base={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter,Segoe UI,Arial',size:13,color:'#10243d'},hoverlabel:{bgcolor:C.navy,bordercolor:C.navy,font:{size:14,color:'#fff'}},xaxis:{gridcolor:'#e2e9f0',zerolinecolor:'#cbd6e0',tickfont:{size:12,color:'#50647c'},automargin:true},yaxis:{gridcolor:'#dce5ed',zerolinecolor:'#cbd6e0',tickfont:{size:12,color:'#50647c'},automargin:true}};
fetch('model_results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('model_results.json was not generated');return r.json()}).then(D=>{
const m=D.model,s=D.states,v=D.validation,b=D.belief_decomposition;const cap=t=>String(t).charAt(0).toUpperCase()+String(t).slice(1),style=`${cap(m.exercise_style)} ${m.option_type}`,pct=(x,d=1)=>(Number(x)*100).toFixed(d)+'%',I=D.interpretation||{},MA=D.maturity_alignment,src=D.sources||[],asOf=src.map(r=>r.observation_date).sort().pop()||m.valuation_date,synthetic=src.some(r=>/synthetic/i.test(r.source));
firmMeta.innerHTML=`<b>${m.company} · ${m.ticker}</b>Valuation date: ${m.valuation_date}<br>${style} · ${m.lattice_steps}-step CRR lattice`;
const kpis=[['CURRENT PRICE',m.spot,'Observed spot',C.navy],['STUDENT DCF',m.dcf_value,'Equity value per share',C.blue],['ANALYST MEAN TARGET',D.analyst_stats.mean,`Median ${money(D.analyst_stats.median)} · ${D.analyst_stats.count} targets`,C.teal],['SELECTED STRIKE',m.strike,style,C.gold],['CRR LATTICE',D.lattice.price,`${m.lattice_steps}-step model`,C.blue],['MARKET MIDPOINT',m.market_mid,`Bid ${money(m.market_bid)} · Ask ${money(m.market_ask)}`,C.orange]];
app.innerHTML=`<section class="kpis">${kpis.map(k=>`<div class="card kpi" style="border-top-color:${k[3]}"><div class="label">${k[0]}</div><div class="value" style="color:${k[3]}">${money(k[1])}</div><div class="hint">${k[2]}</div></div>`).join('')}</section>
<section class="card inputs"><span class="tag">MODEL INPUTS</span><span>Maturity<b>${Number(m.maturity_years).toFixed(2)} yr</b></span><span>Risk-free<b>${pct(m.risk_free_rate,2)}</b></span><span>Dividend yield<b>${pct(m.dividend_yield,2)}</b></span><span>Volatility<b>${pct(m.volatility)} (${m.volatility_type})</b></span><span>Analyst horizon<b>${D.analyst_horizon_months??'—'} mo</b></span><span>Inputs as of<b>${asOf}</b></span>${synthetic?'<span>Data<b>Synthetic demonstration</b></span>':''}</section>
<section class="row"><article class="card panel"><div class="head"><div><h2><span class="n">1</span>Equity valuation</h2><p class="caption">Current price and independent valuation estimates</p></div></div><div id="valuation" class="plot"></div></article><article class="card panel"><div class="head"><div><h2><span class="n">2</span>Analyst target distribution</h2><p class="caption">Cross-sectional analyst opinions, not risk-neutral probabilities</p></div></div><div class="summary-chips"><span class="chip"><i class="sw" style="color:#0b2747"></i>Mean <b>${money(D.analyst_stats.mean)}</b></span><span class="chip"><i class="sw dash" style="color:#e2a72d"></i>Median <b>${money(D.analyst_stats.median)}</b></span><span class="chip">Range <b>${money(D.analyst_stats.min)}–${money(D.analyst_stats.max)}</b></span></div><div id="distribution" class="plot"></div></article><article class="card panel"><div class="head"><div><h2><span class="n">3</span>Five-state construction</h2><p class="caption">Analyst-informed scenarios with disclosed subjective weights</p></div></div><table class="state-table"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th><th>PAYOFF</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${stateColors[i]}">${z.state}</span></td><td>${money(z.terminal_price)}</td><td>${(z.subjective_weight*100).toFixed(0)}%</td><td>${money(z.option_payoff)}</td></tr>`).join('')}</tbody></table><div class="checks"><div class="check">✓ Weights total 100%</div><div class="check">✓ Scenario inputs valid</div></div></article></section>
<section class="row mid"><article class="card panel"><div class="head"><div><h2><span class="n">4</span>Derivative payoff layer</h2><p class="caption">Continuous payoff profile with all five scenario outcomes</p></div></div><div id="payoff" class="plot"></div><div class="outcomes">${s.map((z,i)=>`<div class="outcome"><div class="state" style="color:${stateColors[i]}">${z.state.toUpperCase()}</div><div class="num">${money(z.option_payoff)}</div><div class="sub">Stock ${money(z.terminal_price)}</div></div>`).join('')}</div></article><article class="card panel"><div class="head"><div><h2><span class="n">5</span>Scenario payoff decomposition</h2><p class="caption">State payoff × subjective weight, then discounted to today</p></div></div><div id="decomposition" class="plot"></div><div class="decomp"><div class="mini"><span>ZERO-PAYOFF WEIGHT</span><b>${(b.weight_zero_payoff*100).toFixed(0)}%</b></div><div class="mini"><span>POSITIVE-PAYOFF WEIGHT</span><b>${(b.weight_positive_payoff*100).toFixed(0)}%</b></div><div class="mini"><span>WEIGHTED TERMINAL PAYOFF</span><b>${money(b.weighted_terminal_payoff)}</b></div><div class="mini"><span>DISCOUNTED VALUE</span><b>${money(D.valuation_weighted_expected_payoff)}</b></div></div><div class="note">${D.distribution_comparison.message} The analyst-scenario payoff and CRR value answer different questions.</div></article><article class="card panel memo"><span class="badge">● WHY THE VALUES DIFFER</span><h3 class="sm">${I.headline||'Compare the three option values.'}</h3><div class="metric"><span>Analyst-scenario payoff</span><b>${money(D.valuation_weighted_expected_payoff)}</b></div><div class="metric"><span>CRR value</span><b>${money(D.lattice.price)}</b></div><div class="metric"><span>Market midpoint</span><b>${money(m.market_mid)}</b></div>${(I.points||[]).length?`<ul class="points">${I.points.map(p=>`<li>${p}</li>`).join('')}</ul>`:'<p>The five-state result is a subjective discounted expected payoff. The CRR result remains the no-arbitrage model value.</p>'}</article></section>
<section class="row bottom"><article class="card panel"><div class="head"><div><h2><span class="n">6</span>Option value comparison</h2><p class="caption">Analyst scenario, CRR lattice, and observed market</p></div></div><div id="comparison" class="plot"></div></article><article class="card panel"><div class="head"><div><h2><span class="n">7</span>Model validation</h2><p class="caption">Automated theoretical and numerical controls</p></div></div><div class="checks">${[[v.inside_theoretical_bounds,'Theoretical bounds','No-arbitrage bounds hold'],[v.put_call_parity_pass,'Put-call parity',`Residual ${Math.abs(v.parity_residual)<5e-5?'≈ 0':Number(v.parity_residual).toFixed(4)}`],[v.valid_risk_neutral_probability,'Valid p*',`p* = ${Number(D.lattice.p_star).toFixed(4)}`],[v.convergence_pass,'Lattice convergence',`200→500 steps: ${Number(v.convergence_gap)<0?'−':'+'}$${Math.abs(v.convergence_gap).toFixed(4)}`]].map(([ok,t,d])=>`<div class="check ${ok?'':'fail'}">${ok?'✓':'✕'} ${t}<small>${d}</small></div>`).join('')}${MA?`<div class="check ${MA.aligned?'':'warn'}" style="grid-column:1/-1">${MA.aligned?'✓':'!'} Maturity alignment<small>${MA.message}</small></div>`:''}</div>${D.convergence?'<div id="convergence" class="plot small"></div>':''}<div class="note">The five analyst scenarios are not a five-branch binomial tree. They provide a transparent belief-based payoff analysis alongside the separate CRR valuation.</div></article><article class="card panel memo"><span class="badge">● CONCLUSION</span>${D.conclusion?`<p class="concl">${D.conclusion}</p>`:`<h3 class="sm">Conclusion not written yet.</h3><div class="empty">Write 2–4 sentences in <code>memo_conclusion</code> (notebook section 8) and re-run. Cover the model, the evidence, the main limitation, and what would change your view, without automatically calling the option mispriced.</div>`}</article></section>
<section class="method">${[['VALUE THE EQUITY','1'],['MODEL ANALYST OPINIONS','2–3'],['SCENARIO PAYOFFS','4–5'],['PRICE AND COMPARE','6'],['VALIDATE AND CONCLUDE','7']].map(([x,p],i)=>`<div class="step"><span>${i+1}</span><div>${x}<br><em>Panel ${p}</em></div></div>`).join('')}</section><div class="footer"><span>Generated from CSV inputs by the executed Python notebook${synthetic?' · Synthetic demonstration data, not a real company':''}.</span><span>Dashboard values are never manually typed.</span></div>`;

const ve=Object.entries(D.valuation),vn=ve.map(x=>x[0]),vv=ve.map(x=>Number(x[1]));
const valuationColors=[C.slate,C.gold,C.blue,C.teal];
const valuationMin=Math.min(...vv),valuationMax=Math.max(...vv),valuationSpread=Math.max(valuationMax-valuationMin,1);
const valuationAxisMin=valuationMin-Math.max(valuationSpread*.65,4),valuationAxisMax=valuationMax+Math.max(valuationSpread*.95,6);
const valuationShapes=vv.map((value,index)=>({type:'line',xref:'x',yref:'y',x0:valuationAxisMin+(valuationAxisMax-valuationAxisMin)*.04,x1:value,y0:vn[index],y1:vn[index],layer:'below',line:{color:valuationColors[index],width:4}}));
valuationShapes.push({type:'line',xref:'x',yref:'paper',x0:Number(m.spot),x1:Number(m.spot),y0:0,y1:1,layer:'below',line:{color:C.navy,width:2,dash:'dot'}});
Plotly.newPlot('valuation',[{type:'scatter',mode:'markers+text',x:vv,y:vn,marker:{size:18,color:valuationColors,line:{color:'#fff',width:2}},text:vv.map(money),textposition:'middle right',textfont:{size:14,color:C.navy},cliponaxis:false,hovertemplate:'<b>%{y}</b><br>Value per share: <b>%{x:$,.2f}</b><extra></extra>'}],{...base,showlegend:false,margin:{l:146,r:82,t:54,b:64},xaxis:{...base.xaxis,title:'Equity value per share',tickprefix:'$',tickformat:',.0f',range:[valuationAxisMin,valuationAxisMax],nticks:6,zeroline:false,automargin:true},yaxis:{...base.yaxis,autorange:'reversed',gridcolor:'rgba(0,0,0,0)',automargin:true,tickfont:{size:12,color:C.navy}},shapes:valuationShapes,annotations:[{x:Number(m.spot),y:1.1,xref:'x',yref:'paper',text:`Market reference ${money(m.spot)}`,showarrow:false,xanchor:'center',font:{size:11,color:C.navy},bgcolor:'rgba(255,255,255,.95)',bordercolor:'#d6e1eb',borderwidth:1,borderpad:4}]},config);

const targets=D.analyst_targets.map(Number).filter(Number.isFinite).sort((a,b)=>a-b),tmin=Math.min(...targets),tmax=Math.max(...targets),pad=Math.max((tmax-tmin)*.14,3);Plotly.newPlot('distribution',[{type:'box',x:targets,name:'',orientation:'h',boxpoints:'all',jitter:.4,pointpos:0,marker:{size:11,color:C.teal,line:{color:'#fff',width:1.5}},line:{color:C.navy,width:2},fillcolor:'rgba(15,169,157,.12)',hovertemplate:'Analyst target <b>%{x:$,.2f}</b><extra></extra>'}],{...base,showlegend:false,margin:{l:32,r:28,t:25,b:58},xaxis:{...base.xaxis,tickprefix:'$',tickformat:',.0f',range:[tmin-pad,tmax+pad],nticks:7,title:'12-month price target'},yaxis:{visible:false},shapes:[{type:'line',xref:'x',yref:'paper',x0:Number(D.analyst_stats.mean),x1:Number(D.analyst_stats.mean),y0:.08,y1:.92,line:{color:C.navy,width:3}},{type:'line',xref:'x',yref:'paper',x0:Number(D.analyst_stats.median),x1:Number(D.analyst_stats.median),y0:.08,y1:.92,line:{color:C.gold,width:3,dash:'dash'}}]},config);
const sp=s.map(z=>Number(z.terminal_price)),xmin=Math.min(...sp,Number(m.strike)),xmax=Math.max(...sp,Number(m.strike)),pr=Math.max(xmax-xmin,10),xs=Math.max(0,xmin-pr*.32),xe=xmax+pr*.28,x=[];for(let q=xs;q<=xe;q+=(xe-xs)/150)x.push(q);const cy=x.map(q=>m.option_type==='call'?Math.max(q-m.strike,0):Math.max(m.strike-q,0));Plotly.newPlot('payoff',[{type:'scatter',mode:'lines',x,y:cy,line:{color:C.orange,width:4},fill:'tozeroy',fillcolor:'rgba(242,118,46,.08)',hovertemplate:'Terminal stock <b>%{x:$,.2f}</b><br>Payoff <b>%{y:$,.2f}</b><extra></extra>'},{type:'scatter',mode:'markers',x:sp,y:s.map(z=>Number(z.option_payoff)),marker:{size:14,color:stateColors,line:{color:'#fff',width:2}},customdata:s.map(z=>z.state),hovertemplate:'<b>%{customdata}</b><br>Stock %{x:$,.2f}<br>Payoff %{y:$,.2f}<extra></extra>'}],{...base,showlegend:false,margin:{l:72,r:25,t:35,b:65},xaxis:{...base.xaxis,tickprefix:'$',tickformat:',.0f',...(innerWidth<640?{nticks:6}:{dtick:Math.max(5,Math.round(pr/6/5)*5)}),range:[xs,xe],title:'Terminal stock price'},yaxis:{...base.yaxis,tickprefix:'$',tickformat:',.0f',rangemode:'tozero',title:'Option payoff'},shapes:[{type:'line',x0:Number(m.strike),x1:Number(m.strike),y0:0,y1:Math.max(...cy),line:{color:C.navy,width:2,dash:'dot'}}]},config);
Plotly.newPlot('decomposition',[{type:'bar',x:s.map(z=>z.state),y:s.map(z=>Number(z.weighted_payoff)),marker:{color:stateColors},text:s.map(z=>money(z.weighted_payoff)),textposition:'outside',cliponaxis:false,textfont:{size:13},hovertemplate:'<b>%{x}</b><br>Weighted payoff %{text}<extra></extra>'}],{...base,showlegend:false,margin:{l:58,r:20,t:35,b:70},xaxis:{...base.xaxis,tickfont:{size:10}},yaxis:{...base.yaxis,tickprefix:'$',tickformat:'.2f',title:'Weighted payoff',rangemode:'tozero'}},config);
const cv=Object.values(D.comparison).map(Number),cn=['Analyst scenario','CRR lattice','Market midpoint'];Plotly.newPlot('comparison',[{type:'bar',x:cn,y:cv,marker:{color:[C.teal,C.blue,C.orange]},text:cv.map(money),textposition:'outside',cliponaxis:false,textfont:{size:17,color:C.navy},hovertemplate:'<b>%{x}</b><br>%{text}<extra></extra>'}],{...base,showlegend:false,bargap:.34,margin:{l:62,r:25,t:38,b:75},xaxis:{...base.xaxis,tickfont:{size:12}},yaxis:{...base.yaxis,tickprefix:'$',tickformat:',.0f',range:[0,Math.max(...cv)*1.27]}},config);
